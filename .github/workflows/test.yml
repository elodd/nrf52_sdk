name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests (${{ matrix.sanitize == '1' && 'sanitizers' || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test SANITIZE=${{ matrix.sanitize }}

  firmware-build:
    name: Firmware build (nRF52840)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build firmware
        run: |
          make clean
          make
          make size

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: sensor_app-hex
          path: build/sensor_app.hex
          if-no-files-found: error
