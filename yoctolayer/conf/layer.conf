# Layer: mic-stream. Receives PDM microphone statistics from the nRF52840 over UART.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mic-stream"
BBFILE_PATTERN_mic-stream = "^${LAYERDIR}/"
BBFILE_PRIORITY_mic-stream = "6"

LAYERDEPENDS_mic-stream = "core"
LAYERSERIES_COMPAT_mic-stream = "scarthgap"
